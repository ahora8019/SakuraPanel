name: Deploy SakuraPanel

on:
  # Production changes are released only through an explicit manual dispatch.
  # This prevents an ordinary merge to main from silently applying D1 migrations
  # and deploying a Worker to production.
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: "Confirm that you reviewed the release report, migration plan, backup, and rollback procedure."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sakurapanel-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Restrict Production releases to main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deployment is only allowed from refs/heads/main."
          exit 1
      - name: Require explicit Production release confirmation
        if: ${{ !inputs.confirm_production_release }}
        run: |
          echo "::error::Production release blocked. Review the release evidence and explicitly confirm the dispatch input."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Release configuration and security preflight
        run: node scripts/release-gate.mjs
      - name: Worker build validation (dry run only)
        run: npx wrangler deploy --dry-run --outdir /tmp/sakurapanel-production-dry-run
      - name: Inspect remote migration state (read-only)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations list sakurapanel --remote
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply sakurapanel --remote
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
      - name: Production smoke test
        env:
          SAKURAPANEL_SMOKE_URL: https://sakurapanel.ronintrb.workers.dev
        run: node scripts/smoke-test.mjs
