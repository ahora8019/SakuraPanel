name: Deploy SakuraPanel

# Production deployment is intentionally manual. Do not add an automatic
# push-to-main deployment trigger without an explicit release-process decision.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakurapanel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply sakurapanel --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Production smoke test
        env:
          SAKURAPANEL_SMOKE_URL: https://sakurapanel.ronintrb.workers.dev
        run: node scripts/smoke-test.mjs
