name: Preview SakuraPanel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakurapanel-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate preview-only configuration
        env:
          PREVIEW_D1_DATABASE_ID: ${{ secrets.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_SECURITY_KV_ID: ${{ secrets.PREVIEW_SECURITY_KV_ID }}
          PREVIEW_AUTH_SECRET: ${{ secrets.PREVIEW_AUTH_SECRET }}
          PREVIEW_BOOTSTRAP_SECRET: ${{ secrets.PREVIEW_BOOTSTRAP_SECRET }}
          PREVIEW_WORKER_URL: ${{ vars.PREVIEW_WORKER_URL }}
        run: |
          node --input-type=module <<'NODE'
          const required = [
            "PREVIEW_D1_DATABASE_ID",
            "PREVIEW_SECURITY_KV_ID",
            "PREVIEW_AUTH_SECRET",
            "PREVIEW_BOOTSTRAP_SECRET",
            "PREVIEW_WORKER_URL"
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) {
            console.error("Preview is not configured. Missing required GitHub preview secrets/variable:", missing.join(", "));
            process.exit(1);
          }
          if (!/^https:\/\//i.test(process.env.PREVIEW_WORKER_URL)) {
            console.error("PREVIEW_WORKER_URL must be an HTTPS workers.dev preview URL.");
            process.exit(1);
          }
          let previewHost = "";
          try { previewHost = new URL(process.env.PREVIEW_WORKER_URL).hostname; } catch {}
          if (!process.env.PREVIEW_WORKER_URL.startsWith("https://") || !previewHost.endsWith(".workers.dev")) {
            console.error("PREVIEW_WORKER_URL must be an HTTPS workers.dev preview URL.");
            process.exit(1);
          }
          if (process.env.PREVIEW_D1_DATABASE_ID === "db7c0fc3-7e65-49c7-8005-a23fd9adbbfb") {
            console.error("Preview D1 must not use the production database.");
            process.exit(1);
          }
          if (process.env.PREVIEW_SECURITY_KV_ID === "fdc01356fa8d48a8bbd375edc113441a") {
            console.error("Preview SECURITY_KV must not use the production namespace.");
            process.exit(1);
          }
          if (process.env.PREVIEW_AUTH_SECRET.length < 32) {
            console.error("PREVIEW_AUTH_SECRET must be at least 32 characters.");
            process.exit(1);
          }
          if (process.env.PREVIEW_AUTH_SECRET === process.env.PREVIEW_BOOTSTRAP_SECRET) {
            console.error("Preview auth and bootstrap secrets must be distinct.");
            process.exit(1);
          }
          NODE

      - name: Generate isolated preview Wrangler config
        env:
          PREVIEW_D1_DATABASE_ID: ${{ secrets.PREVIEW_D1_DATABASE_ID }}
          PREVIEW_SECURITY_KV_ID: ${{ secrets.PREVIEW_SECURITY_KV_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const config = {
            name: "sakurapanel-preview",
            main: "src/index.ts",
            compatibility_date: "2026-10-06",
            workers_dev: true,
            observability: { enabled: true, logs: { enabled: true, head_sampling_rate: 1 }, traces: { enabled: true, head_sampling_rate: 0.1 } },
            d1_databases: [{ binding: "DB", database_name: "sakurapanel-preview", database_id: process.env.PREVIEW_D1_DATABASE_ID, migrations_dir: "migrations" }],
            kv_namespaces: [{ binding: "SECURITY_KV", id: process.env.PREVIEW_SECURITY_KV_ID }]
          };
          writeFileSync("wrangler.preview.jsonc", JSON.stringify(config, null, 2) + "\n", { mode: 0o600 });
          NODE

      - name: Apply preview D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply sakurapanel-preview --remote --config wrangler.preview.jsonc

      - name: Set independent preview secrets
        env:
          PREVIEW_AUTH_SECRET: ${{ secrets.PREVIEW_AUTH_SECRET }}
          PREVIEW_BOOTSTRAP_SECRET: ${{ secrets.PREVIEW_BOOTSTRAP_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '%s' "$PREVIEW_AUTH_SECRET" | npx wrangler secret put AUTH_SECRET --config wrangler.preview.jsonc
          printf '%s' "$PREVIEW_BOOTSTRAP_SECRET" | npx wrangler secret put BOOTSTRAP_SECRET --config wrangler.preview.jsonc

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config wrangler.preview.jsonc

      - name: Preview smoke test
        env:
          SAKURAPANEL_SMOKE_URL: ${{ vars.PREVIEW_WORKER_URL }}
        run: node scripts/smoke-test.mjs
